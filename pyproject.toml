[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroscale-lab"
version = "0.1.0"
description = "Reproducible analysis of multiscale neural complexity and cognitive workload"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pandas>=2.0", "scipy>=1.12", "scikit-learn>=1.4", "mne>=1.7", "duckdb>=1.0", "pyarrow>=16", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
neuroscale = "neuroscale.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
